name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish-tauri:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            args: ""
          - platform: macos-latest
            target: aarch64-apple-darwin
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            target: x86_64-apple-darwin
            args: "--target x86_64-apple-darwin"

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install frontend dependencies
        run: npm ci

      - name: Install macOS build tools
        if: matrix.platform == 'macos-latest'
        run: |
          brew update
          brew list imagemagick >/dev/null 2>&1 || brew install imagemagick
          brew list ffmpeg >/dev/null 2>&1 || brew install ffmpeg

      - name: Download sidecars
        shell: bash
        run: |
          set -e
          chmod +x scripts/download-sidecars.sh
          bash scripts/download-sidecars.sh "${{ matrix.target }}"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: v__VERSION__
          releaseName: "source_transform v__VERSION__"
          releaseBody: "增加软硬编码适配"
          releaseDraft: false
          prerelease: false
          includeUpdaterJson: true
          updaterJsonPreferNsis: true
          # 产物名：source_transform_8.2.0_windows-x86_64_setup.exe
          #         source_transform_8.2.0_darwin-aarch64.dmg
          # [setup] 仅 NSIS 安装包为 _setup，其它为空
          assetNamePattern: source_transform_[version]_[platform]-[arch][setup].[ext]
          args: ${{ matrix.args }}
