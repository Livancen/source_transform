<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>素材转换工具</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #f1f2f3;
        color: #1f2329;
        font-family: "Segoe UI", -apple-system, BlinkMacSystemFont, "PingFang SC",
          "Microsoft YaHei", sans-serif;
      }
      #boot-screen {
        position: fixed;
        inset: 0;
        z-index: 99999;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 16px;
        background: #f1f2f3;
        transition: opacity 0.2s ease;
      }
      #boot-screen.is-done {
        opacity: 0;
        pointer-events: none;
      }
      #boot-screen .boot-spinner {
        width: 36px;
        height: 36px;
        border: 3px solid #e0e0e0;
        border-top-color: #04d76a;
        border-radius: 50%;
        animation: boot-spin 0.7s linear infinite;
      }
      #boot-screen .boot-title {
        font-size: 15px;
        font-weight: 600;
        color: #1f2329;
        letter-spacing: 0.02em;
      }
      #boot-screen .boot-sub {
        font-size: 12px;
        color: #8f959e;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>

  <body>
    <div id="boot-screen" aria-busy="true" aria-live="polite">
      <div class="boot-spinner" aria-hidden="true"></div>
      <div class="boot-title">素材转换工具</div>
      <div class="boot-sub">正在加载…</div>
    </div>
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
